[package]
name = "queueback-media-runtime"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "Pinned QueueBack ffmpeg/ffprobe runtime contract"
license = "MIT"

[dependencies]
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["fs", "io-util", "macros", "process", "rt-multi-thread", "time"] }

[dev-dependencies]
tempfile = "3"
