[package]
name = "chronobreak-replay-time"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "Exact canonical replay-time contract for Chronobreak"
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
jsonschema = { version = "0.33", default-features = false }
