[package]
name = "chronobreak-recorder-control"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
description = "Bounded local recorder ownership and service availability"

[dependencies]
anyhow = "1"
directories = "6"
getrandom = { version = "0.3", features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["io-util", "net", "rt", "sync", "time", "macros"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Pipes", "Win32_System_Registry", "Win32_System_RemoteDesktop", "Win32_System_Threading"] }

[dev-dependencies]
tempfile = "3"

[target.'cfg(windows)'.dev-dependencies]
windows = { version = "0.62", features = ["Win32_System_Diagnostics_ToolHelp"] }
