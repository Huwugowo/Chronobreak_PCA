[package]
name = "chronobreak-setup"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
publish = false

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[target.'cfg(windows)'.dependencies]
chronobreak-recorder-control = { path = "../../../recorder-control" }
directories = "6"
windows = { version = "0.62", features = ["Wdk_Storage_FileSystem", "Win32_Foundation", "Win32_Security_Cryptography_Catalog", "Win32_Security_Cryptography_Sip", "Win32_Security_WinTrust", "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_System_Diagnostics_ToolHelp", "Win32_System_IO", "Win32_System_Registry", "Win32_System_Threading", "Win32_UI_Shell", "Win32_UI_Shell_Common"] }

[features]
fixture = ["chronobreak-recorder-control/setup-fixture"]

[dev-dependencies]
tempfile = "3"
